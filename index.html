<!DOCTYPE html>
<html lang="en" data-theme="mocha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="script.js" defer></script>
    <title>Study Site</title>
</head>
<body>
    <!-- refactored Code -->
    <nav>
        <h1>Study Site</h1>
        <div class="rightSide">
            <button class="switchType" id="navButton" onClick="flipQuestionType()">Switch Question Type</button>
            <button class="switchType" id="navButton" onClick="flipAnswerType()">Switch Answer Type</button>
            <i class="fa fa-gear" id="settings" onclick="settingsButton()"></i>
        </div>
    </nav>
    <main>
        <dialog id="settingsMenu">
            <div class="settingsMenuWrapper">
                <div class="settingOption">
                    <h2>Switch Question Type:</h2>
                    <button class="switchType settingsButton" onClick="flipQuestionType()">Switch Question Type</button>
                </div>
                <div class="settingOption">
                    <h2>Switch Answer Option:</h2>
                    <button class="switchType settingsButton" onClick="flipAnswerType()">Switch Answer Type</button>
                </div>
            </div>
        </dialog>
        <header>
            <h1 id="questionTitle">Question:</h1>
            <h3 id="scoring">Answer Streak: 0</h3>
        </header>
        <div class="flashCardWrapper">
            <p id="question">Question itself!!</p>
        </div>
        <div class="answerWrapper">
            <ul class="answerOptions" id="answerOptions">
                <li class="answerOption" onclick="chooseAnswer(`a`)" id="optionA">
                    <h2>A</h2>
                    <p class="answer">Option A</p>
                </li>
                <li class="answerOption" onclick="chooseAnswer(`b`)" id="optionB">
                    <h2>B</h2>
                    <p class="answer">Option B</p>
                </li>
                <li class="answerOption" onclick="chooseAnswer(`c`)" id="optionC">
                    <h2>C</h2>
                    <p class="answer">Option C</p>
                </li>
                <li class="answerOption" onclick="chooseAnswer(`d`)" id="optionD">
                    <h2>D</h2>
                    <p class="answer">Option D</p>
                </li>
            </ul>
            <input class="disabled" type="text" id="answerBox">
        </div>
        <div class="submitArea">
            <div class="buttonsWrapper">
                <button class="AnswerButton" onclick="submitAnswer()">Submit</button>
                <input type="file" id="csvFileInput" accept=".csv" />
            </div>
        </div>
        <div class="CorrectOrIncorrect" id="CorrectOrIncorrect">
            <h1 class="answerStatus" id="answerStatus">Correct or Incorrect</h1>
            <p class="answerText" id="answerText">This is place holder text but question = answer</p>
        </div>
    </main>
</body>
</html>
