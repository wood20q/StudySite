<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Study Site</title>
</head>
<body>
    <H2>Question:</H2>
    <p id="question">Question itself!!</p>
    <ul class="awnserOptions">
        <li class="awnserOption" onclick="chooseAwnser(`a`)" id="optionA">
            <h2>A</h2>
            <p>Option A</p>
        </li>
        <li class="awnserOption" onclick="chooseAwnser(`b`)" id="optionB">
            <h2>B</h2>
            <p>Option B</p>
        </li>
        <li class="awnserOption" onclick="chooseAwnser(`c`)" id="optionC">
            <h2>C</h2>
            <p>Option C</p>
        </li>
        <li class="awnserOption" onclick="chooseAwnser(`d`)" id="optionD">
            <h2>D</h2>
            <p>Option D</p>
        </li>
    </ul>
    <button class="AwnserButton" onclick="submitAwnser()">Submit</button>
    <input type="file" id="csvFileInput" accept=".csv" />
</body>
</html>
